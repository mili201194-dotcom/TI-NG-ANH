    // =========================================================================
    // 2. APPLICATION STATE & STORAGE
    // =========================================================================
    const STORAGE_KEY = "ket_a2_joyful_prep_v1";

    let state = {
      currentTestId: 1,
      currentPart: 1,
      mode: "practice", // 'practice' (instant check) | 'exam' (check on submit)
      activeP4Blank: 19,
      p2MobileTab: "questions", // 'texts' | 'questions'
      // answers[testId] = { mc: {1: 'A', ...}, open: {25: 'of', ...}, writing: {31: '...', 32: '...'}, submittedParts: {1: true, ...}, showSample: {31: false, 32: false} }
      progress: {}
    };

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state.currentTestId = parsed.currentTestId || 1;
          state.currentPart = parsed.currentPart || 1;
          state.mode = parsed.mode || "practice";
          state.progress = parsed.progress || {};
        }
      } catch (e) {
        console.warn("Could not load state:", e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          currentTestId: state.currentTestId,
          currentPart: state.currentPart,
          mode: state.mode,
          progress: state.progress
        }));
      } catch (e) {
        console.warn("Could not save state:", e);
      }
    }

    function getTestData(testId = state.currentTestId) {
      return KET_TESTS.find(t => t.id === Number(testId)) || KET_TESTS[0];
    }

    function getTestProgress(testId = state.currentTestId) {
      if (!state.progress[testId]) {
        state.progress[testId] = {
          mc: {},
          open: {},
          writing: { 31: "", 32: "" },
          submittedParts: {},
          showSample: { 31: false, 32: false }
        };
      }
      return state.progress[testId];
    }

    // =========================================================================
    // 3. SCORING & EVALUATION HELPERS
    // =========================================================================
    function isMcCorrect(test, qNum, chosenLetter) {
      if (!chosenLetter) return false;
      if (qNum >= 1 && qNum <= 6) {
        const item = test.part1.find(x => x.q === qNum);
        return item && item.ans === chosenLetter;
      }
      if (qNum >= 7 && qNum <= 13) {
        const item = test.part2.questions.find(x => x.q === qNum);
        return item && item.ans === chosenLetter;
      }
      if (qNum >= 14 && qNum <= 18) {
        const item = test.part3.questions.find(x => x.q === qNum);
        return item && item.ans === chosenLetter;
      }
      if (qNum >= 19 && qNum <= 24) {
        const item = test.part4.questions.find(x => x.q === qNum);
        return item && item.ans === chosenLetter;
      }
      return false;
    }

    function normalizeWord(w) {
      return (w || "").trim().toLowerCase().replace(/’/g, "'");
    }

    function isOpenCorrect(test, qNum, userWord) {
      const item = test.part5.questions.find(x => x.q === qNum);
      if (!item || !userWord) return false;
      const clean = normalizeWord(userWord);
      return item.ans.some(valid => normalizeWord(valid) === clean);
    }

    function calculateTestScore(testId) {
      const test = getTestData(testId);
      const prog = getTestProgress(testId);
      let correct = 0;
      let answered = 0;

      for (let q = 1; q <= 24; q++) {
        if (prog.mc[q]) {
          answered++;
          if (isMcCorrect(test, q, prog.mc[q])) correct++;
        }
      }
      for (let q = 25; q <= 30; q++) {
        if (prog.open[q] && prog.open[q].trim() !== "") {
          answered++;
          if (isOpenCorrect(test, q, prog.open[q])) correct++;
        }
      }
      const w31 = countWords(prog.writing[31]);
      const w32 = countWords(prog.writing[32]);
      const writingDone = (w31 >= 25 ? 1 : 0) + (w32 >= 35 ? 1 : 0);

      return { correct, answered, totalObj: 30, writingDone };
    }

    function countWords(str) {
      const trimmed = (str || "").trim();
      if (!trimmed) return 0;
      return trimmed.split(/\s+/).length;
    }

    function isQuestionRevealed(partNum, qNum) {
      const prog = getTestProgress();
      if (prog.submittedParts[partNum]) return true;
      if (state.mode === "practice") {
        if (partNum <= 4) return Boolean(prog.mc[qNum]);
        if (partNum === 5) return Boolean(prog.open[qNum] && prog.open[qNum].trim() !== "");
      }
      return false;
    }

        `<option value="${t.id}" ${t.id === state.currentTestId ? "selected" : ""}>${t.title} • ${t.topic.split(",")[0]}</option>`
      ).join("");
      sel.addEventListener("change", (e) => {
        state.currentTestId = Number(e.target.value);
        state.activeP4Blank = 19;
        saveState();
        renderAll();
        showToast(`Đã chuyển sang ${getTestData().title}`, "📘");
      });
    }

    function setMode(newMode) {
      state.mode = newMode;
      saveState();
      renderAll();
      showToast(
        newMode === "practice"
          ? "Chế độ Luyện tập: Chấm điểm & giải thích ngay khi chọn!"
          : "Chế độ Thi thử: Ấn 'Nộp bài Phần này' để xem đáp án!",
        newMode === "practice" ? "🌱" : "⏱️"
      );
    }

    function selectPart(partNum) {
      state.currentPart = partNum;
      if (partNum === 4) state.activeP4Blank = 19;
      saveState();
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function chooseMc(partNum, qNum, letter) {
      const prog = getTestProgress();
      prog.mc[qNum] = letter;
      if (partNum === 4 && qNum < 24) {
        state.activeP4Blank = qNum + 1;
      }
      saveState();
      renderAll();
    }

    function updateOpenInput(qNum, val) {
      const prog = getTestProgress();
      prog.open[qNum] = val;
      saveState();
      if (state.mode === "practice") {
        // Re-render feedback inline without losing focus if triggered on blur/enter
      }
    }

    function commitOpenInput(qNum, val) {
      const prog = getTestProgress();
      prog.open[qNum] = val;
      saveState();
      renderAll();
    }

    function submitCurrentPart() {
      const prog = getTestProgress();
      prog.submittedParts[state.currentPart] = true;
      saveState();
      renderAll();
      showToast(`Đã nộp và chấm điểm Part ${state.currentPart}!`, "✅");
    }

    function resetCurrentPart() {
      const prog = getTestProgress();
      const p = state.currentPart;
      if (p === 1) for (let q = 1; q <= 6; q++) delete prog.mc[q];
      if (p === 2) for (let q = 7; q <= 13; q++) delete prog.mc[q];
      if (p === 3) for (let q = 14; q <= 18; q++) delete prog.mc[q];
      if (p === 4) { for (let q = 19; q <= 24; q++) delete prog.mc[q]; state.activeP4Blank = 19; }
      if (p === 5) for (let q = 25; q <= 30; q++) delete prog.open[q];
      if (p === 6) { prog.writing[31] = ""; prog.showSample[31] = false; }
      if (p === 7) { prog.writing[32] = ""; prog.showSample[32] = false; }
      delete prog.submittedParts[p];
      saveState();
      renderAll();
      showToast(`Đã làm mới Part ${p}!`, "🔄");
    }

    function confirmResetCurrentTest() {
      const test = getTestData();
      state.progress[test.id] = {
        mc: {},
        open: {},
        writing: { 31: "", 32: "" },
        submittedParts: {},
        showSample: { 31: false, 32: false }
      };
      saveState();
      renderAll();
      renderProgressModal();
      showToast(`Đã xóa dữ liệu làm bài của ${test.title}`, "🧹");
    }

    function updateWriting(qNum, text) {
      const prog = getTestProgress();
      prog.writing[qNum] = text;
      saveState();
      const wc = countWords(text);
      const target = qNum === 31 ? 25 : 35;
      const counterEl = document.getElementById(`wordCounter_${qNum}`);
      const badgeEl = document.getElementById(`wordBadge_${qNum}`);
      if (counterEl) counterEl.textContent = `${wc} từ`;
      if (badgeEl) {
        if (wc >= target) {
          badgeEl.className = "text-xs font-bold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-200";
          badgeEl.textContent = `✓ Đạt chuẩn (≥ ${target} từ)`;
        } else {
          badgeEl.className = "text-xs font-bold px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 border border-amber-200";
          badgeEl.textContent = `Cần thêm ${target - wc} từ nữa`;
        }
      }
      updateHeaderBadge();
    }

    function toggleSample(qNum) {
      const prog = getTestProgress();
      prog.showSample[qNum] = !prog.showSample[qNum];
      saveState();
      renderAll();
    }

    function insertStarter(qNum, snippet) {
      const ta = document.getElementById(`writingArea_${qNum}`);
      if (!ta) return;
      const cur = ta.value;
      const next = cur ? (cur.endsWith(" ") || cur.endsWith("\n") ? cur + snippet : cur + " " + snippet) : snippet;
      ta.value = next;
      ta.focus();
      updateWriting(qNum, next);
    }

    function copyTextFallback(text) {
      const temp = document.createElement("textarea");
      temp.value = text;
      document.body.appendChild(temp);
      temp.select();
      try {
        document.execCommand("copy");
        showToast("Đã sao chép bài mẫu vào bộ nhớ tạm!", "📋");
      } catch (err) {
        showToast("Không thể sao chép tự động.", "⚠️");
      }
      document.body.removeChild(temp);
    }

    function showToast(msg, icon = "✨") {
      const box = document.getElementById("toastBox");
      document.getElementById("toastMsg").textContent = msg;
      document.getElementById("toastIcon").textContent = icon;
      box.classList.remove("translate-y-20", "opacity-0");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        box.classList.add("translate-y-20", "opacity-0");
      }, 2500);
    }

    function toggleModal(modalId, open) {
      const el = document.getElementById(modalId);
      if (!el) return;
      if (open) {
        if (modalId === "tipsModal") renderTipsModal();
        if (modalId === "progressModal") renderProgressModal();
        el.classList.remove("hidden");
      } else {
        el.classList.add("hidden");
      }
    }

      const score = calculateTestScore(state.currentTestId);
      document.getElementById("headerScoreBadge").textContent = `${score.correct}/30`;

      } else {

    function renderPartNav() {
      const container = document.getElementById("partNavContainer");
      const test = getTestData();
      const prog = getTestProgress();

      container.innerHTML = PART_META.map(pm => {
        const active = pm.id === state.currentPart;
        // Check part completion
        let statusDot = "";
        if (pm.id === 1) {
          const cnt = [1,2,3,4,5,6].filter(q => prog.mc[q]).length;
          if (cnt === 6) statusDot = "●";
        } else if (pm.id === 2) {
          const cnt = [7,8,9,10,11,12,13].filter(q => prog.mc[q]).length;
          if (cnt === 7) statusDot = "●";
        } else if (pm.id === 3) {
          const cnt = [14,15,16,17,18].filter(q => prog.mc[q]).length;
          if (cnt === 5) statusDot = "●";
        } else if (pm.id === 4) {
          const cnt = [19,20,21,22,23,24].filter(q => prog.mc[q]).length;
          if (cnt === 6) statusDot = "●";
        } else if (pm.id === 5) {
          const cnt = [25,26,27,28,29,30].filter(q => prog.open[q] && prog.open[q].trim()).length;
          if (cnt === 6) statusDot = "●";
        } else if (pm.id === 6) {
          if (countWords(prog.writing[31]) >= 25) statusDot = "●";
        } else if (pm.id === 7) {
          if (countWords(prog.writing[32]) >= 35) statusDot = "●";

        return `

        <div class="space-y-2.5">
          <h3 class="font-display font-bold text-base text-slate-800">🎯 Mẹo nhanh cho từng phần thi KET (A2)</h3>
          <div class="p-3.5 rounded-2xl bg-cream-50 border border-amber-100 space-y-1.5 text-xs sm:text-sm">
            <p><b>• Part 1 (Biển báo/Tin nhắn):</b> Đừng chọn đáp án chỉ vì lặp lại y hệt một từ trong biển báo. Hãy tìm câu diễn đạt lại (paraphrase) đúng ý nghĩa toàn câu.</p>
            <p><b>• Part 2 (Nối 3 đoạn văn):</b> Đọc 7 câu hỏi trước, gạch chân từ khóa, sau đó quét nhanh từng đoạn A, B, C để tìm thông tin tương ứng.</p>
            <p><b>• Part 3 (Đọc hiểu dài):</b> Thứ tự câu hỏi 14 → 17 luôn đi theo trình tự từ trên xuống dưới của bài đọc. Câu 18 thường hỏi ý chính hoặc tiêu đề.</p>
            <p><b>• Part 4 & 5 (Điền từ):</b> Chú ý các cụm từ cố định (collocations) như <i>interested in, good at, look for, by bus, for the first time</i> và thì của động từ.</p>
            <p><b>• Part 6 & 7 (Viết):</b> Viết đủ số từ tối thiểu (≥ 25 từ cho Email, ≥ 35 từ cho Truyện tranh), trả lời đủ 3 ý yêu cầu và chia đúng thì quá khứ đơn khi kể chuyện.</p>
          </div>
        </div>
      `;
    }

    function renderProgressModal() {
      let totalCorrectAll = 0;
      const cardsHtml = KET_TESTS.map(t => {
        const sc = calculateTestScore(t.id);
        totalCorrectAll += sc.correct;
        const pct = Math.round((sc.correct / 30) * 100);
        const isCur = t.id === state.currentTestId;

        return `
          <div onclick="state.currentTestId=${t.id}; document.getElementById('testSelector').value=${t.id}; saveState(); renderAll(); toggleModal('progressModal', false);"
            class="cursor-pointer rounded-2xl p-3.5 border-2 transition card-hover ${
              isCur ? "bg-mint-50 border-teal-500" : "bg-white hover:bg-slate-50 border-slate-200/80"
            }">
            <div class="flex items-center justify-between mb-1.5">
              <span class="font-extrabold text-sm text-slate-800">${t.title}</span>
              <span class="text-xs font-extrabold px-2 py-0.5 rounded-md ${
                sc.correct >= 21 ? "bg-emerald-100 text-emerald-800" : sc.answered > 0 ? "bg-sky-100 text-sky-800" : "bg-slate-100 text-slate-500"
              }">
                ${sc.correct}/30 câu
              </span>
            </div>
            <p class="text-[11px] text-slate-500 truncate mb-2">${t.topic}</p>
            <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden mb-1.5">
              <div class="h-full bg-gradient-to-r from-teal-400 to-sky-500 rounded-full" style="width: ${pct}%"></div>
            </div>
            <div class="flex items-center justify-between text-[11px] font-semibold text-slate-500">
              <span>Đã làm: ${sc.answered}/30</span>
              <span>Viết: ${sc.writingDone}/2 bài</span>
            </div>
          </div>
        `;
      }).join("");

      document.getElementById("progressModalBody").innerHTML = `
        <div class="bg-gradient-to-r from-teal-500 to-sky-500 rounded-2xl p-4 text-white flex flex-wrap items-center justify-between gap-3">
          <div>
            <p class="text-xs font-bold uppercase opacity-90">Tổng thành tích tích lũy (14 đề)</p>
            <p class="font-display font-bold text-2xl">${totalCorrectAll} / ${14 * 30} câu đúng</p>
          </div>
          <div class="text-xs bg-white/20 px-3 py-2 rounded-xl font-semibold">
            💡 Nhấn vào bất kỳ thẻ đề nào bên dưới để mở đề đó ngay!
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
          ${cardsHtml}
        </div>
      `;
    }

    // =========================================================================
    // 6. MAIN RENDER ORCHESTRATOR
    // =========================================================================
    function renderAll() {
      const test = getTestData();
      updateHeaderBadge();
      renderModeButtons();
      renderPartNav();
      renderPartBanner();

      const contentEl = document.getElementById("partContent");
      let html = "";
      switch (state.currentPart) {
        case 1: html = renderPart1(test); break;
        case 2: html = renderPart2(test); break;
        case 3: html = renderPart3(test); break;
        case 4: html = renderPart4(test); break;
        case 5: html = renderPart5(test); break;
        case 6: html = renderPart6(test); break;
        case 7: html = renderPart7(test); break;
      }
      contentEl.innerHTML = html;
      renderBottomBar();
    }

    window.onload = function () {
      loadState();
      initSelector();
      renderAll();
    };
  </script>
</body>
</html>
